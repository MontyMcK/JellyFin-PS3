[theme]
name        = XMB wave
author      = vortigauntlet

[colors]         ; RRGGBB, no alpha — the renderer owns alpha
bg_top      = 151A38
bg_bot      = 05060C
accent      = AA5CC3     ; focus glow, selection, tab underline, progress fills
accent_alt  = 00A4DC     ; chips, eyebrows, badges
accent_deep = 8A47A9     ; ramp start for the primary action
wordmark    = 00A4DC     ; flat fallback for the lockup (REDUCED / MINIMAL tiers)

; Lockup ramp — Jellyfin's official pair, AA5CC3 -> 00A4DC, run TWICE.
; The mark keeps the source logo's own gradient (axis 12,30 -> 72,63).
; The wordmark mirrors it: cyan on the left, violet on the right.
scrim       = 05060C,0.90 ; options-cross backdrop, left
scrim_2     = 05060C,0.66 ; options-cross backdrop, right
focus_ring  = E4EBFA     ; cool off-white, replaces pure white on focused cards
detail_band = 412C73     ; item-detail header band

lk_mark_a   = AA5CC3     ; mark gradient start (source logo)
lk_mark_b   = 00A4DC     ; mark gradient end   (source logo)
lk_word_a   = 00A4DC     ; wordmark stop 1, left
lk_word_b   = 4189D3     ; wordmark stop 2 (34%)
lk_word_c   = 7A70CA     ; wordmark stop 3 (67%)
lk_word_d   = AA5CC3     ; wordmark stop 4, right
text        = E9EBF5
text_dim    = 99A0BC
text_faint  = 5C6386
panel       = 191E3C
panel_hi    = 232950
hairline    = 2C3258
thumb_dim   = 12162C
track       = 10142A
icon_idle   = 646C96
white       = FFFFFF
trim        = 000000     ; unused; trim_alpha = 0

[style]
card_radius = 4          ; 0 | 4 | 8
chip_radius = 999        ; 999 = pill
glow_alpha  = 115        ; 0-255
wave_alpha  = 28         ; 0-255, 0 = flat background
trim_alpha  = 0          ; 0 = trim off
ramp_steps  = 12         ; primary action sweep, 0 = flat
